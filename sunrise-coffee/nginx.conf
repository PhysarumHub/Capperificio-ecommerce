server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # ── Compressione Gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy Shopware: ^~ ha priorità sulle regex, evita il match .jpg/.png ─
    location ^~ /store-api {
        proxy_pass http://shopware:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /media {
        proxy_pass http://shopware:80;
    }

    location ^~ /thumbnail {
        proxy_pass http://shopware:80;
    }

    # ── Backend pagamenti (Express su porta 3001) ─────────────
    location ^~ /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── robots.txt & sitemap.xml ───────────────────────────────
    location = /robots.txt {
        expires 1d;
        access_log off;
    }
    location = /sitemap.xml {
        expires 1d;
        access_log off;
    }

    # ── Cache per risorse statiche del frontend (js/css/fonts) ─
    # NON mettere jpg/png/svg qui: le immagini Shopware passano per /media
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache per le immagini statiche del frontend (solo /images/ dist)
    location ^~ /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Frontend SPA — tutte le route non trovate → index.html ─
    location / {
        try_files $uri $uri/ /index.html;
    }
}
