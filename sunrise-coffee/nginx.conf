# ── Rotte valide della SPA ───────────────────────────────────────────
# Sorgente di verità per distinguere una rotta reale da un URL inesistente:
# senza questo la SPA risponderebbe 200 a qualunque path (soft 404), e Google
# indicizzerebbe URL inventati. Va tenuta allineata a src/App.jsx.
map $uri $is_spa_route {
    default 0;

    "~^/$"                                                        1;
    "~^/(cart|checkout|b2b|blog|storia|storia2|territorio)/?$"     1;
    "~^/(processo-produttivo|carosello-3d|test-a|test-b)/?$"       1;
    "~^/(privacy-policy|cookie-policy|termini-e-condizioni)/?$"    1;
    "~^/account(/(login|register))?/?$"                            1;
    "~^/product/[^/]+/?$"                                          1;
    "~^/collections/[^/]+/?$"                                      1;
    "~^/blog/[^/]+/?$"                                             1;
}

server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # ── Compressione Gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Proxy Shopware: ^~ ha priorità sulle regex, evita il match .jpg/.png ─
    location ^~ /store-api {
        proxy_pass http://shopware:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /media {
        proxy_pass http://shopware:80;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ^~ /thumbnail {
        proxy_pass http://shopware:80;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── Media Strapi (immagini blog) ──────────────────────────
    # La porta 1337 non è più pubblica: le cover degli articoli passano da qui.
    location ^~ /uploads {
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── Backend pagamenti (Express su porta 3001) ─────────────
    location ^~ /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── robots.txt ────────────────────────────────────────────
    location = /robots.txt {
        expires 1d;
        access_log off;
    }

    # ── Sitemap dinamica (generata da Express con prodotti live) ──
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=3600, s-maxage=7200";
        access_log off;
    }

    # ── Cache per risorse statiche del frontend (js/css/fonts) ─
    # NON mettere jpg/png/svg qui: le immagini Shopware passano per /media
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache per le immagini statiche del frontend (solo /images/ dist)
    location ^~ /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Frontend SPA ───────────────────────────────────────────
    # File statico se esiste, altrimenti la shell React. Le rotte non
    # riconosciute cadono in @spa_fallback e ricevono un 404 vero.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        # Rotta valida → shell React con 200
        if ($is_spa_route) {
            rewrite ^ /index.html break;
        }
        # Rotta inesistente → 404 reale (il body arriva da error_page)
        return 404;
    }

    # Il 404 mostra comunque la UI della SPA (NotFoundPage), ma con lo
    # status corretto: nessun "=" qui, altrimenti nginx riscriverebbe a 200.
    error_page 404 /index.html;
}
