# ── Rate limit sulla Store API ───────────────────────────────────────
# I codici sconto si applicano via POST /store-api/checkout/cart/line-item,
# senza passare dal backend Express: senza limite, un codice promo è
# forzabile a tentativi. 10 r/s con burst 20 è abbondante per la navigazione
# reale (una pagina prodotto fa poche chiamate) ma rende impraticabile il
# brute force. Vale per tutta la Store API, quindi copre anche login e
# registrazione cliente.
limit_req_zone $binary_remote_addr zone=storeapi:10m rate=10r/s;

# ── Rotte valide della SPA ───────────────────────────────────────────
# Sorgente di verità per distinguere una rotta reale da un URL inesistente:
# senza questo la SPA risponderebbe 200 a qualunque path (soft 404), e Google
# indicizzerebbe URL inventati. Va tenuta allineata a src/App.jsx.
map $uri $is_spa_route {
    default 0;

    "~^/$"                                                        1;
    "~^/(cart|checkout|b2b|storia|territorio)/?$"                  1;
    "~^/(processo-produttivo|test-a|test-b)/?$"                    1;
    "~^/newsletter-subscribe/?$"                                   1;
    "~^/(privacy-policy|cookie-policy|termini-e-condizioni)/?$"    1;
    "~^/(contatti|faq)/?$"                                         1;
    "~^/account(/(login|register))?/?$"                            1;
    "~^/product/[^/]+/?$"                                          1;
    "~^/collections/[^/]+/?$"                                      1;
}

server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # ── Host canonico: apex → www ──────────────────────────────
    # Il sito dichiara canonical su https://www.capperificiocaro.com, quindi
    # l'apex deve redirigere lì e non servire una copia del sito (contenuto
    # duplicato). Vincolato all'host esatto: accessi per IP o localhost
    # continuano a funzionare normalmente per i test.
    # Se il redirect è già gestito da Traefik davanti, questo è un no-op.
    if ($host = capperificiocaro.com) {
        return 301 https://www.capperificiocaro.com$request_uri;
    }

    # ── Compressione Gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src https://js.stripe.com https://hooks.stripe.com https://www.googletagmanager.com https://www.google.com https://maps.google.com; form-action 'self'" always;

    # ── Proxy Shopware: ^~ ha priorità sulle regex, evita il match .jpg/.png ─
    location ^~ /store-api {
        limit_req zone=storeapi burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://shopware:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /media {
        proxy_pass http://shopware:80;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ^~ /thumbnail {
        proxy_pass http://shopware:80;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── Backend pagamenti (Express su porta 3001) ─────────────
    location ^~ /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── robots.txt ────────────────────────────────────────────
    location = /robots.txt {
        expires 1d;
        access_log off;
    }

    # ── Sitemap dinamica (generata da Express con prodotti live) ──
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=3600, s-maxage=7200";
        access_log off;
    }

    # ── Cache per risorse statiche del frontend (js/css/fonts) ─
    # NON mettere jpg/png/svg qui: le immagini Shopware passano per /media
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache per le immagini statiche del frontend (solo /images/ dist)
    location ^~ /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Frontend SPA ───────────────────────────────────────────
    # File statico se esiste, altrimenti la shell React. Le rotte non
    # riconosciute cadono in @spa_fallback e ricevono un 404 vero.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        # Rotta valida → shell React con 200
        if ($is_spa_route) {
            rewrite ^ /index.html break;
        }
        # Rotta inesistente → 404 reale (il body arriva da error_page)
        return 404;
    }

    # Il 404 mostra comunque la UI della SPA (NotFoundPage), ma con lo
    # status corretto: nessun "=" qui, altrimenti nginx riscriverebbe a 200.
    error_page 404 /index.html;
}
