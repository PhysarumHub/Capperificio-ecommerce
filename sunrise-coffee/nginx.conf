server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # Frontend SPA — tutte le route non trovate → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend pagamenti (Express su porta 3001)
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy verso Shopware (evita problemi CORS in dev)
    location /store-api {
        proxy_pass http://shopware:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media {
        proxy_pass http://shopware:80;
    }

    location /thumbnail {
        proxy_pass http://shopware:80;
    }
}
