# ============================================================
#  Capperificio E-commerce — Stack completo
#
#  Servizi:
#    shopware   → Shopware 6 CMS/backend  http://localhost:8090
#    frontend   → React + Express          http://localhost:3001
#
#  Avvio:  docker compose up -d --build
#  Stop:   docker compose down
#
#  Admin Shopware:  http://localhost:8090/admin  (admin / shopware)
#  Adminer DB:      http://localhost:8891
#  Mailcatcher:     http://localhost:9998
# ============================================================

services:

  # ── Shopware 6 ───────────────────────────────────────────
  shopware:
    image: dockware/dev:latest
    container_name: capperificio-shopware
    ports:
      - "8090:80"    # Shopware HTTP
      - "8453:443"   # Shopware HTTPS
      - "8891:8888"  # Adminer (gestore DB)
      - "9998:9999"  # Mailcatcher (email di test)
    environment:
      - SHOP_DOMAIN=localhost:8090
      - APP_ENV=dev
    volumes:
      - shopware_data:/var/www/html
    networks:
      - capperificio_net
    restart: unless-stopped

  # ── Frontend React + Backend Express ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Le variabili VITE_* vengono embedded nel bundle al momento del build
        - VITE_SHOPWARE_API_URL=${VITE_SHOPWARE_API_URL:-http://localhost:3000/store-api}
        - VITE_SHOPWARE_ACCESS_KEY=${VITE_SHOPWARE_ACCESS_KEY}
        - VITE_SHOPWARE_STOREFRONT_URL=${VITE_SHOPWARE_STOREFRONT_URL:-default.headless0}
        - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY}
        - VITE_PAYPAL_CLIENT_ID=${VITE_PAYPAL_CLIENT_ID}
        - VITE_B2B_CATEGORY_ID=${VITE_B2B_CATEGORY_ID}
        - VITE_B2B_GROUP_NAME=${VITE_B2B_GROUP_NAME:-B2B}
        - VITE_STRAPI_URL=${VITE_STRAPI_URL:-http://localhost:1337}
        - VITE_STRAPI_TOKEN=${VITE_STRAPI_TOKEN}
    container_name: capperificio-frontend
    ports:
      - "3001:80"    # Frontend (nginx)
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - shopware
    networks:
      - capperificio_net
    restart: unless-stopped

  # ── PostgreSQL per Strapi ────────────────────────────────
  strapi-db:
    image: postgres:16-alpine
    container_name: capperificio-strapi-db
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${STRAPI_DB_PASSWORD}
    volumes:
      - strapi_db_data:/var/lib/postgresql/data
    networks:
      - capperificio_net
    restart: unless-stopped

  # ── Strapi CMS ───────────────────────────────────────────
  strapi:
    image: node:20-alpine
    container_name: capperificio-strapi
    working_dir: /srv/app
    command: sh -c "npm install && npm run build && npm start"
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi-db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${STRAPI_DB_PASSWORD}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      URL: ${STRAPI_URL:-http://localhost:1337}
    volumes:
      - ./strapi:/srv/app
      - strapi_uploads:/srv/app/public/uploads
    depends_on:
      - strapi-db
    networks:
      - capperificio_net
    restart: unless-stopped

networks:
  capperificio_net:
    driver: bridge

volumes:
  shopware_data:
    driver: local
  strapi_db_data:
    driver: local
  strapi_uploads:
    driver: local
